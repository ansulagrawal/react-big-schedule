name: Release on Merge

on:
  push:
    branches: [master]

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # npm trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # -----------------------------
      # CONFIGURE GIT (REQUIRED NOW)
      # -----------------------------
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # -----------------------------
      # GET PR DATA
      # -----------------------------
      - uses: actions/github-script@v9
        id: pr
        with:
          script: |
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            });

            if (!prs.data.length) {
              core.setOutput("should_release", "false");
              return;
            }

            const pr = prs.data[0];
            const labels = pr.labels.map(l => l.name.toLowerCase().trim());

            const isDependabot = pr.user.login === 'dependabot[bot]';
            const skip = labels.includes('skip');
            // dependabot PRs are always beta, whatever labels it adds
            const bump = isDependabot ? 'beta' : labels.includes('major') ? 'major' : labels.includes('minor') ? 'minor' : 'beta';

            core.setOutput("number", pr.number);
            core.setOutput("should_release", skip ? "false" : "true");
            core.setOutput("is_beta", bump === 'beta' ? "true" : "false");
            core.setOutput("bump", bump);

      # -----------------------------
      # NODE SETUP
      # -----------------------------
      - uses: actions/setup-node@v7
        if: steps.pr.outputs.should_release == 'true'
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2
        if: steps.pr.outputs.should_release == 'true'

      - run: bun install --frozen-lockfile
        if: steps.pr.outputs.should_release == 'true'

      - name: Check code quality
        if: steps.pr.outputs.should_release == 'true'
        run: bun run check

      - name: Build library
        if: steps.pr.outputs.should_release == 'true'
        run: bun run build:lib

      # -----------------------------
      # VERSION BUMP (WITH COMMIT)
      # -----------------------------
      - name: Bump version
        id: version
        if: steps.pr.outputs.should_release == 'true'
        run: |
          BUMP="${{ steps.pr.outputs.bump }}"
          IS_BETA="${{ steps.pr.outputs.is_beta }}"

          if [ "$IS_BETA" = "true" ]; then
            npm version prerelease --preid=beta -m "chore(release): bump version to %s [skip ci]"
          else
            npm version $BUMP -m "chore(release): bump version to %s [skip ci]"
          fi

          NEW=$(node -p "require('./package.json').version")
          echo "new_version=$NEW" >> $GITHUB_OUTPUT

      # -----------------------------
      # PUBLISH
      # -----------------------------
      - name: Publish Beta
        if: steps.pr.outputs.should_release == 'true' && steps.pr.outputs.is_beta == 'true'
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=${{ steps.version.outputs.new_version }}

          if npm view "$PKG@$VERSION" version 2>/dev/null; then
            echo "Already exists"
          else
            npm publish --tag beta --access public
          fi

      - name: Publish Stable
        if: steps.pr.outputs.should_release == 'true' && steps.pr.outputs.is_beta == 'false'
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=${{ steps.version.outputs.new_version }}

          if npm view "$PKG@$VERSION" version 2>/dev/null; then
            echo "Already exists"
          else
            npm publish --access public
          fi

      # push only after a successful publish so a failed publish never leaves master bumped
      - name: Push version bump
        if: steps.pr.outputs.should_release == 'true'
        run: git push origin HEAD:master --follow-tags

      # -----------------------------
      # GITHUB RELEASE
      # -----------------------------
      - name: Create GitHub Release
        if: steps.pr.outputs.should_release == 'true' && steps.pr.outputs.is_beta == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.version.outputs.new_version }}
          NOTES=".github/release-notes/v${VERSION}.md"
          if [ -f "$NOTES" ]; then
            gh release create "v${VERSION}" --title "Release v${VERSION}" --notes-file "$NOTES"
          else
            gh release create "v${VERSION}" --title "Release v${VERSION}" --generate-notes
          fi

      # -----------------------------
      # COMMENT PR
      # -----------------------------
      - name: Comment PR
        if: steps.pr.outputs.should_release == 'true'
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          VERSION: ${{ steps.version.outputs.new_version }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const version = process.env.VERSION;
            if (!prNumber) return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `🚀 Release completed: **v${version}**`
            });
